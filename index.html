<!DOCTYPE html>  
<html lang="id">  
<head>  
  <meta charset="UTF-8">  
  <title>Haikal Al Barr Prasetyo</title>  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">  
  <style>  
    body {  
      margin: 0;  
      font-family: 'Courier New', monospace;  
      background-color: #000;  
      color: white;  
      text-align: center;  
      /* Mengurangi padding atas agar elemen naik ke atas */
      padding: 20px 10px;  
      min-height: 100vh;
      overflow-x: hidden;
    }  

    /* Memastikan background partikel memenuhi layar di belakang konten */
    #particles-js {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .glass-box {  
      background: rgba(255, 255, 255, 0.05);  
      padding: 20px;  
      border-radius: 15px;  
      /* Margin atas dibuat kecil agar kotak berada di atas */
      margin: 10px auto;  
      width: 90%;
      max-width: 500px;  
      box-shadow: 0 0 15px red;  
      position: relative;
      z-index: 1;
    }  

    h1 {
      margin-top: 0;
      margin-bottom: 5px;
      color: white;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: white;
      font-weight: normal;
    }

    .center-image {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }
  </style>  
</head>  
<body>  
  <!-- Background Partikel -->
  <div id="particles-js"></div>    

  <!-- Kotak Utama Berisi Gambar -->
  <div class="glass-box">  
    <h1>Haikal Al Barr Prasetyo</h1>  
    <h2>Kelas X TKJ 1</h2>
    
    <!-- Gambar yang di-request diletakkan di tengah kotak -->
    <img src="https://h.top4top.io/p_3868kyk8e2.png" alt="Gambar Materi Muhammadiyah" class="center-image">
  </div>    

  <!-- Script untuk partikel background -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>    
  <script>  
    // Inisialisasi efek partikel background
    particlesJS("particles-js", { 
      particles: { 
        number: { value: 60 }, 
        color: { value: "#fff" }, 
        shape: { type: "circle" }, 
        opacity: { value: 0.4 }, 
        size: { value: 3 }, 
        line_linked: { enable: true, distance: 150, color: "#fff", opacity: 0.3, width: 1 }, 
        move: { enable: true, speed: 2 } 
      }, 
      interactivity: { 
        events: { onhover: { enable: true, mode: "grab" } }, 
        modes: { grab: { distance: 200, line_linked: { opacity: 1 } } } 
      }, 
      retina_detect: true 
    });  
  </script>  
</body>  
</html>
